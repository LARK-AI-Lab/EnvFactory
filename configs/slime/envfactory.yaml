# slime custom config for EnvFactory tool-agent RL (passed as --custom-config-path).
# Keys become attributes of slime's args; see src/rollout/slime/generate.py and reward.py.

# rollout
environment_config_path: configs/mcp_server.json  # Relative paths resolve from the repo root.
tool_format: qwen3          # qwen3 (Hermes JSON, EnvFactory SFT models) | qwen3_coder (Qwen3.5 XML)
max_interaction_turns: 10   # Assistant turns per rollout.
max_tool_response_length: 512  # Characters per observation; 0 keeps observations whole.
truncate_side: middle       # left | right | middle
tool_max_workers: 64        # Threads for tool calls and chat-template rendering.

# reward: max(0, tau * trace + (1 - tau) * state - length/format penalties)
reward_tau: 0.5
