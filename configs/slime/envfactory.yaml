# slime custom config for EnvFactory tool-agent RL (passed as --custom-config-path).
# Keys become attributes of slime's args; read by src/rollout/slime/generate.py and reward.py.

# rollout
environment_config_path: configs/mcp_server.json  # Relative paths resolve from the repo root.
max_interaction_turns: 10   # Assistant turns per rollout.
max_tool_response_length: 4096  # Characters per observation (99th percentile of reference observations); 0 keeps them whole.
truncate_side: middle       # left | right | middle

# reward: max(0, tau * trace + (1 - tau) * state - length/format penalties)
reward_tau: 0.5
